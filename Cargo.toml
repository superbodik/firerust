[workspace]
resolver = "3"
members = ["crates/*", "tools/test-server"]

[workspace.package]
edition = "2024"
version = "0.0.1"
publish = false

[workspace.dependencies]
brotli = "9.1.1"
cosmic-text = "0.19.0"
cssparser = "0.38.0"
html5ever = "0.40.1"
boa_engine = { version = "0.22.0", default-features = false }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markup5ever_rcdom = "0.40.1"
softbuffer = "0.4.8"
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
tiny-skia = "0.12.0"
ureq = { version = "3.5.1", features = ["brotli", "cookies"] }
url = "2.5.8"
winit = "0.30.13"
fr-bookmarks = { version = "0.0.1", path = "crates/fr-bookmarks" }
fr-dpapi = { version = "0.0.1", path = "crates/fr-dpapi" }
fr-passwords = { version = "0.0.1", path = "crates/fr-passwords" }
fr-cache = { version = "0.0.1", path = "crates/fr-cache" }
fr-css = { version = "0.0.1", path = "crates/fr-css" }
fr-dom = { version = "0.0.1", path = "crates/fr-dom" }
fr-form = { version = "0.0.1", path = "crates/fr-form" }
fr-geom = { version = "0.0.1", path = "crates/fr-geom" }
fr-js = { version = "0.0.1", path = "crates/fr-js" }
fr-html = { version = "0.0.1", path = "crates/fr-html" }
fr-history = { version = "0.0.1", path = "crates/fr-history" }
fr-image = { version = "0.0.1", path = "crates/fr-image" }
fr-layout = { version = "0.0.1", path = "crates/fr-layout" }
fr-mem = { version = "0.0.1", path = "crates/fr-mem" }
fr-net = { version = "0.0.1", path = "crates/fr-net" }
fr-paint = { version = "0.0.1", path = "crates/fr-paint" }
fr-security = { version = "0.0.1", path = "crates/fr-security" }
fr-page = { version = "0.0.1", path = "crates/fr-page" }
fr-raster = { version = "0.0.1", path = "crates/fr-raster" }
fr-tab = { version = "0.0.1", path = "crates/fr-tab" }
fr-test-server = { version = "0.0.1", path = "tools/test-server" }
fr-text = { version = "0.0.1", path = "crates/fr-text" }
fr-ui = { version = "0.0.1", path = "crates/fr-ui" }
fr-window = { version = "0.0.1", path = "crates/fr-window" }
