<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Counter</title>
<style>
body { font-family: sans-serif; background-color: #f4f1ea; }
h1 { color: #b7410e; }
#count { font-size: 48px; font-weight: bold; margin: 12px 0; }
.buttons button { display: block; width: 140px; padding: 6px 14px; margin-bottom: 6px; background-color: #b7410e; color: #ffffff; text-align: center; }
.big { color: #0b5fa5; }
#clock { color: #666666; margin-top: 16px; }
</style>
</head>
<body>
<h1>Counter</h1>
<div id="count">0</div>
<div class="buttons">
<button id="plus">Plus</button><button id="minus">Minus</button><button id="reset">Reset</button>
</div>
<p id="clock">Seconds on the page: 0</p>
<script>
var count = 0;
var seconds = 0;
var display = document.getElementById('count');

function render() {
  display.textContent = String(count);
  if (count >= 5) {
    display.classList.add('big');
  } else {
    display.classList.remove('big');
  }
}

document.getElementById('plus').addEventListener('click', function () {
  count += 1;
  render();
});
document.getElementById('minus').addEventListener('click', function () {
  count -= 1;
  render();
});
document.getElementById('reset').onclick = function () {
  count = 0;
  render();
};

setInterval(function () {
  seconds += 1;
  document.getElementById('clock').textContent = 'Seconds on the page: ' + seconds;
}, 1000);
</script>
</body>
</html>
