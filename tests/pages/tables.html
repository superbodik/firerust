<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tables</title>
<style>
body { background-color: #f4f1ea; }
table.data { width: 100%; border: 2px solid #b7410e; background-color: #ffffff; }
table.data th { background-color: #b7410e; color: #ffffff; padding: 6px 10px; }
table.data td { padding: 6px 10px; border-bottom: 1px solid #cccccc; }
.num { text-align: right; }
.total td { font-weight: bold; background-color: #fff3cd; }
</style>
</head>
<body>
<h2>Sizes</h2>
<table class="data">
<thead><tr><th>Crate</th><th>What it does</th><th>Lines</th></tr></thead>
<tbody>
<tr><td>fr-css</td><td>Parses styles and runs the cascade</td><td class="num">4200</td></tr>
<tr><td>fr-layout</td><td>Boxes, text wrapping, flexbox and tables</td><td class="num">3100</td></tr>
<tr><td>fr-paint</td><td>Display list and painting</td><td class="num">380</td></tr>
<tr class="total"><td colspan="2">Total</td><td class="num">7680</td></tr>
</tbody>
</table>
<p>A narrow table that is only as wide as its content:</p>
<table bgcolor="#d9ead3"><tr><td>one</td><td>two</td><td>three</td></tr><tr><td>four</td><td>five</td><td>six</td></tr></table>
</body>
</html>
